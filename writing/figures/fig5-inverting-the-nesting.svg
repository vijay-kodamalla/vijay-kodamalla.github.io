<svg viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" font-family="Newsreader, Georgia, serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="760" height="430" fill="#f6f7f5"/>

  <text x="32" y="38" font-size="19" font-weight="600" fill="#171d1a">The same 512 bytes, nested two ways</text>
  <text x="32" y="62" font-size="14" fill="#59635d">Nothing is added or removed. Only the order changes — and the order is the stride.</text>

  <!-- ===== TOP: pass inside lane ===== -->
  <text x="32" y="102" font-size="13" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-weight="600" fill="#b4741f">byte = 16m₀ + 4m₁ + b</text>
  <text x="220" y="102" font-size="13" fill="#59635d">pass nested inside lane</text>

  <g font-size="9" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace">
    <!-- lane 0 block -->
    <rect x="32" y="114" width="176" height="46" fill="#faf5ec" stroke="#b4741f" stroke-width="1.5"/>
    <rect x="36" y="120" width="40" height="20" fill="#f6f7f5" stroke="#e0cbaa"/><text x="56" y="134" text-anchor="middle" fill="#8a6a3a">m₁=0</text>
    <rect x="76" y="120" width="40" height="20" fill="#f6f7f5" stroke="#e0cbaa"/><text x="96" y="134" text-anchor="middle" fill="#8a6a3a">m₁=1</text>
    <rect x="116" y="120" width="40" height="20" fill="#f6f7f5" stroke="#e0cbaa"/><text x="136" y="134" text-anchor="middle" fill="#8a6a3a">m₁=2</text>
    <rect x="156" y="120" width="40" height="20" fill="#f6f7f5" stroke="#e0cbaa"/><text x="176" y="134" text-anchor="middle" fill="#8a6a3a">m₁=3</text>
    <text x="120" y="153" text-anchor="middle" font-size="10" fill="#b4741f" font-weight="600">lane 0  —  bytes 0–15</text>

    <!-- lane 1 block -->
    <rect x="212" y="114" width="176" height="46" fill="#eef0ec" stroke="#b6bdb7"/>
    <rect x="216" y="120" width="40" height="20" fill="#f6f7f5" stroke="#dfe3de"/><text x="236" y="134" text-anchor="middle" fill="#8a938d">m₁=0</text>
    <rect x="256" y="120" width="40" height="20" fill="#f6f7f5" stroke="#dfe3de"/><text x="276" y="134" text-anchor="middle" fill="#8a938d">m₁=1</text>
    <rect x="296" y="120" width="40" height="20" fill="#f6f7f5" stroke="#dfe3de"/><text x="316" y="134" text-anchor="middle" fill="#8a938d">m₁=2</text>
    <rect x="336" y="120" width="40" height="20" fill="#f6f7f5" stroke="#dfe3de"/><text x="356" y="134" text-anchor="middle" fill="#8a938d">m₁=3</text>
    <text x="300" y="153" text-anchor="middle" font-size="10" fill="#59635d">lane 1  —  bytes 16–31</text>

    <rect x="392" y="114" width="112" height="46" fill="#eef0ec" stroke="#b6bdb7"/>
    <text x="448" y="141" text-anchor="middle" font-size="11" fill="#8a938d">lanes 2 … 30</text>

    <rect x="508" y="114" width="176" height="46" fill="#eef0ec" stroke="#b6bdb7"/>
    <text x="596" y="134" text-anchor="middle" font-size="10" fill="#8a938d">m₁ = 0, 1, 2, 3</text>
    <text x="596" y="153" text-anchor="middle" font-size="10" fill="#59635d">lane 31 — bytes 496–511</text>
  </g>

  <text x="32" y="182" font-size="12" fill="#b4741f">Each lane owns 16 contiguous bytes. Consecutive lanes are 16 bytes apart → 4 banks apart.</text>

  <line x1="32" y1="202" x2="728" y2="202" stroke="#dfe3de"/>

  <!-- ===== BOTTOM: lane inside pass ===== -->
  <text x="32" y="238" font-size="13" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-weight="600" fill="#0f7a4e">byte = 4m₀ + 128m₁ + b</text>
  <text x="220" y="238" font-size="13" fill="#59635d">lane nested inside pass</text>

  <g font-size="9" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace">
    <!-- pass 0 block -->
    <rect x="32" y="250" width="176" height="46" fill="#e2efe8" stroke="#0f7a4e" stroke-width="1.5"/>
    <rect x="36" y="256" width="30" height="20" fill="#f6f7f5" stroke="#a8ccb9"/><text x="51" y="270" text-anchor="middle" fill="#0f7a4e">L0</text>
    <rect x="66" y="256" width="30" height="20" fill="#f6f7f5" stroke="#a8ccb9"/><text x="81" y="270" text-anchor="middle" fill="#0f7a4e">L1</text>
    <rect x="96" y="256" width="30" height="20" fill="#f6f7f5" stroke="#a8ccb9"/><text x="111" y="270" text-anchor="middle" fill="#0f7a4e">L2</text>
    <rect x="126" y="256" width="44" height="20" fill="#f6f7f5" stroke="#a8ccb9"/><text x="148" y="270" text-anchor="middle" fill="#8a938d">…</text>
    <rect x="170" y="256" width="34" height="20" fill="#f6f7f5" stroke="#a8ccb9"/><text x="187" y="270" text-anchor="middle" fill="#0f7a4e">L31</text>
    <text x="120" y="289" text-anchor="middle" font-size="10" fill="#0f7a4e" font-weight="600">m₁=0  —  bytes 0–127</text>

    <!-- pass 1 -->
    <rect x="212" y="250" width="176" height="46" fill="#eef0ec" stroke="#b6bdb7"/>
    <rect x="216" y="256" width="30" height="20" fill="#f6f7f5" stroke="#dfe3de"/><text x="231" y="270" text-anchor="middle" fill="#8a938d">L0</text>
    <rect x="246" y="256" width="30" height="20" fill="#f6f7f5" stroke="#dfe3de"/><text x="261" y="270" text-anchor="middle" fill="#8a938d">L1</text>
    <rect x="276" y="256" width="30" height="20" fill="#f6f7f5" stroke="#dfe3de"/><text x="291" y="270" text-anchor="middle" fill="#8a938d">L2</text>
    <rect x="306" y="256" width="44" height="20" fill="#f6f7f5" stroke="#dfe3de"/><text x="328" y="270" text-anchor="middle" fill="#b6bdb7">…</text>
    <rect x="350" y="256" width="34" height="20" fill="#f6f7f5" stroke="#dfe3de"/><text x="367" y="270" text-anchor="middle" fill="#8a938d">L31</text>
    <text x="300" y="289" text-anchor="middle" font-size="10" fill="#59635d">m₁=1  —  bytes 128–255</text>

    <rect x="392" y="250" width="146" height="46" fill="#eef0ec" stroke="#b6bdb7"/>
    <text x="465" y="270" text-anchor="middle" font-size="10" fill="#8a938d">L0 … L31</text>
    <text x="465" y="289" text-anchor="middle" font-size="10" fill="#59635d">m₁=2 — bytes 256–383</text>

    <rect x="542" y="250" width="146" height="46" fill="#eef0ec" stroke="#b6bdb7"/>
    <text x="615" y="270" text-anchor="middle" font-size="10" fill="#8a938d">L0 … L31</text>
    <text x="615" y="289" text-anchor="middle" font-size="10" fill="#59635d">m₁=3 — bytes 384–511</text>
  </g>

  <text x="32" y="318" font-size="12" fill="#0f7a4e">Each lane owns 4 bytes per pass. Consecutive lanes are 4 bytes apart → exactly 1 bank apart.</text>
  <text x="32" y="336" font-size="12" fill="#59635d">Lane 0 now owns bytes 0–3, 128–131, 256–259, 384–387. Still 16 bytes — no longer contiguous.</text>

  <rect x="32" y="356" width="696" height="58" rx="6" fill="#eef0ec" stroke="#dfe3de"/>
  <text x="50" y="378" font-size="13" fill="#171d1a">The fix did not destroy contiguity. It <tspan font-weight="600">moved</tspan> it — off the time axis and onto the lane axis,</text>
  <text x="50" y="396" font-size="13" fill="#171d1a">which is the one that is parallel.</text>
  <text x="50" y="410" font-size="11" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" fill="#59635d">size = 512 · cosize = 512 · both bijections onto the same block → the change is free</text>
</svg>
