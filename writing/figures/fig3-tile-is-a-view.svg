<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="Newsreader, Georgia, serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="760" height="420" fill="#f6f7f5"/>

  <text x="32" y="38" font-size="19" font-weight="600" fill="#171d1a">A tile is a view: your shape, the parent's strides</text>
  <text x="32" y="62" font-size="14" fill="#59635d">The tile owns 8192 elements, but they are scattered across a span of 845,376.</text>

  <!-- parent matrix -->
  <rect x="32" y="88" width="330" height="230" fill="#eef0ec" stroke="#dfe3de"/>
  <text x="42" y="108" font-size="12" fill="#8a938d">full matrix — row length N = 6656</text>

  <!-- the tile inside -->
  <rect x="52" y="126" width="58" height="120" fill="#f3e6d2" stroke="#b4741f" stroke-width="2"/>
  <text x="81" y="192" font-size="11" font-weight="600" fill="#b4741f" text-anchor="middle">tile</text>
  <text x="81" y="207" font-size="10" fill="#b4741f" text-anchor="middle">128×64</text>

  <!-- row-run annotation -->
  <line x1="52" y1="262" x2="110" y2="262" stroke="#b4741f" stroke-width="2"/>
  <text x="120" y="266" font-size="11" fill="#b4741f">64 contiguous elements</text>
  <line x1="110" y1="278" x2="352" y2="278" stroke="#8a938d" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="120" y="294" font-size="11" fill="#8a938d">…then 6592 elements belonging to other tiles…</text>
  <line x1="52" y1="306" x2="110" y2="306" stroke="#b4741f" stroke-width="2"/>
  <text x="120" y="310" font-size="11" fill="#b4741f">next row of the tile</text>

  <!-- right side: the layouts -->
  <text x="412" y="112" font-size="13" font-weight="600" fill="#171d1a">In global memory</text>
  <rect x="412" y="124" width="316" height="86" rx="6" fill="#faf5ec" stroke="#e0cbaa"/>
  <text x="430" y="150" font-size="14" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" fill="#171d1a">(128,64) : (6656,1)</text>
  <text x="430" y="168" font-size="10" fill="#8a938d">tile's shape        parent's strides</text>
  <text x="430" y="190" font-size="12" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" fill="#b4741f">size 8192  ·  cosize 845,376  →  a view</text>

  <text x="412" y="244" font-size="13" font-weight="600" fill="#171d1a">In shared memory</text>
  <rect x="412" y="256" width="316" height="86" rx="6" fill="#e2efe8" stroke="#bcd8ca"/>
  <text x="430" y="282" font-size="14" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" fill="#171d1a">(128,64) : (64,1)</text>
  <text x="430" y="300" font-size="10" fill="#8a938d">same shape          packed strides</text>
  <text x="430" y="322" font-size="12" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" fill="#0f7a4e">size 8192  ·  cosize 8192  →  a bijection</text>

  <!-- arrow between -->
  <line x1="570" y1="212" x2="570" y2="250" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#59635d"/>
    </marker>
  </defs>
  <text x="582" y="236" font-size="11" fill="#59635d">the copy</text>

  <rect x="32" y="352" width="696" height="46" rx="6" fill="#eef0ec" stroke="#dfe3de"/>
  <text x="50" y="371" font-size="13" fill="#171d1a">Identical shapes. Different strides. <tspan font-weight="600">That difference is the copy.</tspan></text>
  <text x="50" y="389" font-size="13" fill="#59635d">Every data movement is a change of layout — and the legal ones preserve cosize.</text>
</svg>
