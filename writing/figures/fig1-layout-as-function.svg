<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" font-family="Newsreader, Georgia, serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="760" height="400" fill="#f6f7f5"/>

  <text x="32" y="40" font-size="19" font-weight="600" fill="#171d1a">A layout is a function</text>
  <text x="32" y="66" font-size="14" fill="#59635d">Shape says what the tensor looks like. Stride says where it lives.</text>

  <!-- formula block -->
  <rect x="32" y="92" width="330" height="120" rx="6" fill="#eef0ec" stroke="#dfe3de"/>
  <text x="52" y="122" font-size="15" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" fill="#171d1a">Layout (8,4):(4,1)</text>
  <text x="52" y="152" font-size="13" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" fill="#59635d">shape  = (8, 4)</text>
  <text x="52" y="174" font-size="13" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" fill="#59635d">stride = (4, 1)</text>
  <text x="52" y="198" font-size="13" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" fill="#b4741f">offset(c) = c₀·4 + c₁·1</text>

  <!-- worked example -->
  <rect x="32" y="230" width="330" height="88" rx="6" fill="#faf5ec" stroke="#e0cbaa"/>
  <text x="52" y="258" font-size="13" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" fill="#171d1a">offset(3, 2)</text>
  <text x="52" y="282" font-size="13" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" fill="#59635d">  = 3·4 + 2·1</text>
  <text x="52" y="306" font-size="13" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" fill="#b4741f">  = 14</text>

  <text x="32" y="352" font-size="13" fill="#59635d">A dot product of coordinate and stride.</text>
  <text x="32" y="372" font-size="13" fill="#59635d">That is the entire definition — everything else builds on it.</text>

  <!-- grid -->
  <text x="470" y="112" font-size="12" fill="#59635d">offset stored at each coordinate</text>

  <!-- column headers -->
  <text x="503" y="136" font-size="11" fill="#8a938d" text-anchor="middle">0</text>
  <text x="547" y="136" font-size="11" fill="#8a938d" text-anchor="middle">1</text>
  <text x="591" y="136" font-size="11" fill="#8a938d" text-anchor="middle">2</text>
  <text x="635" y="136" font-size="11" fill="#8a938d" text-anchor="middle">3</text>
  <text x="663" y="136" font-size="11" fill="#8a938d" text-anchor="middle">c₁</text>

  <g font-size="12" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace">
    <!-- row 0 -->
    <text x="470" y="163" font-size="11" fill="#8a938d" text-anchor="end">0</text>
    <rect x="481" y="146" width="44" height="26" fill="#f6f7f5" stroke="#dfe3de"/><text x="503" y="164" text-anchor="middle" fill="#3b443f">0</text>
    <rect x="525" y="146" width="44" height="26" fill="#f6f7f5" stroke="#dfe3de"/><text x="547" y="164" text-anchor="middle" fill="#3b443f">1</text>
    <rect x="569" y="146" width="44" height="26" fill="#f6f7f5" stroke="#dfe3de"/><text x="591" y="164" text-anchor="middle" fill="#3b443f">2</text>
    <rect x="613" y="146" width="44" height="26" fill="#f6f7f5" stroke="#dfe3de"/><text x="635" y="164" text-anchor="middle" fill="#3b443f">3</text>
    <!-- row 1 -->
    <text x="470" y="189" font-size="11" fill="#8a938d" text-anchor="end">1</text>
    <rect x="481" y="172" width="44" height="26" fill="#f6f7f5" stroke="#dfe3de"/><text x="503" y="190" text-anchor="middle" fill="#3b443f">4</text>
    <rect x="525" y="172" width="44" height="26" fill="#f6f7f5" stroke="#dfe3de"/><text x="547" y="190" text-anchor="middle" fill="#3b443f">5</text>
    <rect x="569" y="172" width="44" height="26" fill="#f6f7f5" stroke="#dfe3de"/><text x="591" y="190" text-anchor="middle" fill="#3b443f">6</text>
    <rect x="613" y="172" width="44" height="26" fill="#f6f7f5" stroke="#dfe3de"/><text x="635" y="190" text-anchor="middle" fill="#3b443f">7</text>
    <!-- row 2 -->
    <text x="470" y="215" font-size="11" fill="#8a938d" text-anchor="end">2</text>
    <rect x="481" y="198" width="44" height="26" fill="#f6f7f5" stroke="#dfe3de"/><text x="503" y="216" text-anchor="middle" fill="#3b443f">8</text>
    <rect x="525" y="198" width="44" height="26" fill="#f6f7f5" stroke="#dfe3de"/><text x="547" y="216" text-anchor="middle" fill="#3b443f">9</text>
    <rect x="569" y="198" width="44" height="26" fill="#f6f7f5" stroke="#dfe3de"/><text x="591" y="216" text-anchor="middle" fill="#3b443f">10</text>
    <rect x="613" y="198" width="44" height="26" fill="#f6f7f5" stroke="#dfe3de"/><text x="635" y="216" text-anchor="middle" fill="#3b443f">11</text>
    <!-- row 3 : highlighted -->
    <text x="470" y="241" font-size="11" fill="#b4741f" text-anchor="end" font-weight="600">3</text>
    <rect x="481" y="224" width="44" height="26" fill="#f6f7f5" stroke="#dfe3de"/><text x="503" y="242" text-anchor="middle" fill="#3b443f">12</text>
    <rect x="525" y="224" width="44" height="26" fill="#f6f7f5" stroke="#dfe3de"/><text x="547" y="242" text-anchor="middle" fill="#3b443f">13</text>
    <rect x="569" y="224" width="44" height="26" fill="#f3e6d2" stroke="#b4741f" stroke-width="2"/><text x="591" y="242" text-anchor="middle" fill="#b4741f" font-weight="700">14</text>
    <rect x="613" y="224" width="44" height="26" fill="#f6f7f5" stroke="#dfe3de"/><text x="635" y="242" text-anchor="middle" fill="#3b443f">15</text>
    <!-- row 4 -->
    <text x="470" y="267" font-size="11" fill="#8a938d" text-anchor="end">4</text>
    <rect x="481" y="250" width="44" height="26" fill="#f6f7f5" stroke="#dfe3de"/><text x="503" y="268" text-anchor="middle" fill="#3b443f">16</text>
    <rect x="525" y="250" width="44" height="26" fill="#f6f7f5" stroke="#dfe3de"/><text x="547" y="268" text-anchor="middle" fill="#3b443f">17</text>
    <rect x="569" y="250" width="44" height="26" fill="#f6f7f5" stroke="#dfe3de"/><text x="591" y="268" text-anchor="middle" fill="#3b443f">18</text>
    <rect x="613" y="250" width="44" height="26" fill="#f6f7f5" stroke="#dfe3de"/><text x="635" y="268" text-anchor="middle" fill="#3b443f">19</text>
    <!-- ellipsis rows -->
    <text x="569" y="292" font-size="13" fill="#8a938d">⋮</text>
    <!-- row 7 -->
    <text x="470" y="323" font-size="11" fill="#8a938d" text-anchor="end">7</text>
    <rect x="481" y="306" width="44" height="26" fill="#f6f7f5" stroke="#dfe3de"/><text x="503" y="324" text-anchor="middle" fill="#3b443f">28</text>
    <rect x="525" y="306" width="44" height="26" fill="#f6f7f5" stroke="#dfe3de"/><text x="547" y="324" text-anchor="middle" fill="#3b443f">29</text>
    <rect x="569" y="306" width="44" height="26" fill="#f6f7f5" stroke="#dfe3de"/><text x="591" y="324" text-anchor="middle" fill="#3b443f">30</text>
    <rect x="613" y="306" width="44" height="26" fill="#f6f7f5" stroke="#dfe3de"/><text x="635" y="324" text-anchor="middle" fill="#3b443f">31</text>
  </g>

  <text x="452" y="349" font-size="11" fill="#8a938d">c₀</text>
  <text x="481" y="366" font-size="12" fill="#59635d">size = 32, cosize = 32 → a bijection</text>
</svg>
