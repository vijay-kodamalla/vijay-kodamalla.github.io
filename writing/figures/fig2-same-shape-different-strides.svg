  <text x="32" y="234" font-size="12" fill="#0f7a4e">shaded row = 8 contiguous addresses</text>
  <text x="32" y="254" font-size="12" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" fill="#b4741f">offset(2,5) = 2·8 + 5·1 = 21</text>

  <!-- divider -->
