  <text x="32" y="300" font-size="13" fill="#59635d">Both are bijections onto the same 32 slots — a pure permutation. CuTe treats</text>
  <text x="32" y="318" font-size="13" fill="#59635d">“change the memory arrangement” as “change the stride,” which is why so many optimizations are stride edits.</text>
