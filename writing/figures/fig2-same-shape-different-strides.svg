<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" font-family="Newsreader, Georgia, serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
