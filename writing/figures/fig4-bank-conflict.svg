<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" font-family="Newsreader, Georgia, serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="760" height="470" fill="#f6f7f5"/>

  <text x="32" y="38" font-size="19" font-weight="600" fill="#171d1a">Where 32 lanes land in 32 banks</text>
  <text x="32" y="62" font-size="14" fill="#59635d">bank = ⌊byte / 4⌋ mod 32. One wavefront only if all 32 lanes hit distinct banks.</text>

  <!-- ===== BEFORE ===== -->
  <text x="32" y="100" font-size="14" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-weight="600" fill="#b4741f">(32,4):(16,4)</text>
  <text x="152" y="100" font-size="13" fill="#59635d">lane stride 16 bytes = 4 banks</text>

  <!-- lanes row -->
  <text x="32" y="126" font-size="11" fill="#8a938d">lane</text>
  <g font-size="10" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace">
    <rect x="70" y="112" width="34" height="20" fill="#f6f7f5" stroke="#dfe3de"/><text x="87" y="126" text-anchor="middle" fill="#3b443f">0</text>
    <rect x="104" y="112" width="34" height="20" fill="#f6f7f5" stroke="#dfe3de"/><text x="121" y="126" text-anchor="middle" fill="#3b443f">1</text>
    <rect x="138" y="112" width="34" height="20" fill="#f6f7f5" stroke="#dfe3de"/><text x="155" y="126" text-anchor="middle" fill="#3b443f">2</text>
    <rect x="172" y="112" width="34" height="20" fill="#f6f7f5" stroke="#dfe3de"/><text x="189" y="126" text-anchor="middle" fill="#3b443f">3</text>
    <rect x="206" y="112" width="34" height="20" fill="#f6f7f5" stroke="#dfe3de"/><text x="223" y="126" text-anchor="middle" fill="#3b443f">4</text>
    <rect x="240" y="112" width="34" height="20" fill="#f6f7f5" stroke="#dfe3de"/><text x="257" y="126" text-anchor="middle" fill="#3b443f">5</text>
    <rect x="274" y="112" width="34" height="20" fill="#f6f7f5" stroke="#dfe3de"/><text x="291" y="126" text-anchor="middle" fill="#3b443f">6</text>
    <rect x="308" y="112" width="34" height="20" fill="#f6f7f5" stroke="#dfe3de"/><text x="325" y="126" text-anchor="middle" fill="#3b443f">7</text>
    <rect x="342" y="112" width="34" height="20" fill="#f3e6d2" stroke="#b4741f" stroke-width="1.5"/><text x="359" y="126" text-anchor="middle" fill="#b4741f" font-weight="700">8</text>
    <rect x="376" y="112" width="34" height="20" fill="#f3e6d2" stroke="#b4741f" stroke-width="1.5"/><text x="393" y="126" text-anchor="middle" fill="#b4741f" font-weight="700">9</text>
    <rect x="410" y="112" width="34" height="20" fill="#f6f7f5" stroke="#dfe3de"/><text x="427" y="126" text-anchor="middle" fill="#8a938d">…</text>
    <rect x="444" y="112" width="34" height="20" fill="#f3e6d2" stroke="#b4741f" stroke-width="1.5"/><text x="461" y="126" text-anchor="middle" fill="#b4741f" font-weight="700">16</text>
    <rect x="478" y="112" width="34" height="20" fill="#f6f7f5" stroke="#dfe3de"/><text x="495" y="126" text-anchor="middle" fill="#8a938d">…</text>
    <rect x="512" y="112" width="34" height="20" fill="#f3e6d2" stroke="#b4741f" stroke-width="1.5"/><text x="529" y="126" text-anchor="middle" fill="#b4741f" font-weight="700">24</text>
  </g>

  <!-- byte row -->
  <text x="32" y="152" font-size="11" fill="#8a938d">byte</text>
  <g font-size="10" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" fill="#8a938d">
    <text x="87" y="152" text-anchor="middle">0</text>
    <text x="121" y="152" text-anchor="middle">16</text>
    <text x="155" y="152" text-anchor="middle">32</text>
    <text x="189" y="152" text-anchor="middle">48</text>
    <text x="223" y="152" text-anchor="middle">64</text>
    <text x="257" y="152" text-anchor="middle">80</text>
    <text x="291" y="152" text-anchor="middle">96</text>
    <text x="325" y="152" text-anchor="middle">112</text>
    <text x="359" y="152" text-anchor="middle" fill="#b4741f">128</text>
    <text x="393" y="152" text-anchor="middle" fill="#b4741f">144</text>
    <text x="461" y="152" text-anchor="middle" fill="#b4741f">256</text>
    <text x="529" y="152" text-anchor="middle" fill="#b4741f">384</text>
  </g>

  <!-- arrows converging -->
  <g stroke="#b4741f" stroke-width="1" fill="none" opacity="0.55">
    <path d="M87,158 L87,196"/>
    <path d="M359,158 C359,178 100,178 89,196"/>
    <path d="M461,158 C461,182 104,182 91,196"/>
    <path d="M529,158 C529,186 108,186 93,196"/>
  </g>
  <g stroke="#8a938d" stroke-width="1" fill="none" opacity="0.45">
    <path d="M121,158 L155,196"/>
    <path d="M155,158 L223,196"/>
    <path d="M189,158 L291,196"/>
    <path d="M223,158 L359,196"/>
    <path d="M257,158 L427,196"/>
    <path d="M291,158 L495,196"/>
    <path d="M325,158 L563,196"/>
  </g>

  <!-- banks row -->
  <text x="32" y="212" font-size="11" fill="#8a938d">bank</text>
  <g font-size="10" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace">
    <rect x="70" y="196" width="38" height="22" fill="#f3e6d2" stroke="#b4741f" stroke-width="1.5"/><text x="89" y="211" text-anchor="middle" fill="#b4741f" font-weight="700">0</text>
    <rect x="108" y="196" width="30" height="22" fill="#e7e9e5" stroke="#dfe3de"/><text x="123" y="211" text-anchor="middle" fill="#b6bdb7">1</text>
    <rect x="138" y="196" width="30" height="22" fill="#e7e9e5" stroke="#dfe3de"/><text x="153" y="211" text-anchor="middle" fill="#b6bdb7">2</text>
    <rect x="168" y="196" width="30" height="22" fill="#e7e9e5" stroke="#dfe3de"/><text x="183" y="211" text-anchor="middle" fill="#b6bdb7">3</text>
    <rect x="198" y="196" width="38" height="22" fill="#f6f7f5" stroke="#8a938d"/><text x="217" y="211" text-anchor="middle" fill="#3b443f">4</text>
    <rect x="236" y="196" width="30" height="22" fill="#e7e9e5" stroke="#dfe3de"/><text x="251" y="211" text-anchor="middle" fill="#b6bdb7">5</text>
    <rect x="266" y="196" width="30" height="22" fill="#e7e9e5" stroke="#dfe3de"/><text x="281" y="211" text-anchor="middle" fill="#b6bdb7">6</text>
    <rect x="296" y="196" width="30" height="22" fill="#e7e9e5" stroke="#dfe3de"/><text x="311" y="211" text-anchor="middle" fill="#b6bdb7">7</text>
    <rect x="326" y="196" width="38" height="22" fill="#f6f7f5" stroke="#8a938d"/><text x="345" y="211" text-anchor="middle" fill="#3b443f">8</text>
    <rect x="364" y="196" width="94" height="22" fill="#e7e9e5" stroke="#dfe3de"/><text x="411" y="211" text-anchor="middle" fill="#b6bdb7">9 … 11</text>
    <rect x="458" y="196" width="38" height="22" fill="#f6f7f5" stroke="#8a938d"/><text x="477" y="211" text-anchor="middle" fill="#3b443f">12</text>
    <rect x="496" y="196" width="94" height="22" fill="#e7e9e5" stroke="#dfe3de"/><text x="543" y="211" text-anchor="middle" fill="#b6bdb7">13 … 15</text>
    <rect x="590" y="196" width="38" height="22" fill="#f6f7f5" stroke="#8a938d"/><text x="609" y="211" text-anchor="middle" fill="#3b443f">16</text>
    <rect x="628" y="196" width="100" height="22" fill="#e7e9e5" stroke="#dfe3de"/><text x="678" y="211" text-anchor="middle" fill="#b6bdb7">17 … 31</text>
  </g>

  <text x="70" y="240" font-size="12" fill="#b4741f" font-weight="600">Lanes 0, 8, 16, 24 all collide on bank 0.</text>
  <text x="70" y="258" font-size="12" fill="#59635d">Only 8 of 32 banks are touched — 24 sit idle (greyed) while 8 are hit four times each.</text>
  <text x="70" y="276" font-size="12" fill="#b4741f" font-weight="600">4-way conflict → 4 wavefronts.</text>

  <line x1="32" y1="298" x2="728" y2="298" stroke="#dfe3de"/>

  <!-- ===== AFTER ===== -->
  <text x="32" y="330" font-size="14" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-weight="600" fill="#0f7a4e">(32,4):(4,128)</text>
  <text x="152" y="330" font-size="13" fill="#59635d">lane stride 4 bytes = exactly 1 bank</text>

  <text x="32" y="356" font-size="11" fill="#8a938d">lane</text>
  <g font-size="10" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace">
    <rect x="70" y="342" width="34" height="20" fill="#f6f7f5" stroke="#dfe3de"/><text x="87" y="356" text-anchor="middle" fill="#3b443f">0</text>
    <rect x="104" y="342" width="34" height="20" fill="#f6f7f5" stroke="#dfe3de"/><text x="121" y="356" text-anchor="middle" fill="#3b443f">1</text>
    <rect x="138" y="342" width="34" height="20" fill="#f6f7f5" stroke="#dfe3de"/><text x="155" y="356" text-anchor="middle" fill="#3b443f">2</text>
    <rect x="172" y="342" width="34" height="20" fill="#f6f7f5" stroke="#dfe3de"/><text x="189" y="356" text-anchor="middle" fill="#3b443f">3</text>
    <rect x="206" y="342" width="34" height="20" fill="#f6f7f5" stroke="#dfe3de"/><text x="223" y="356" text-anchor="middle" fill="#3b443f">4</text>
    <rect x="240" y="342" width="132" height="20" fill="#f6f7f5" stroke="#dfe3de"/><text x="306" y="356" text-anchor="middle" fill="#8a938d">5 … 29</text>
    <rect x="372" y="342" width="34" height="20" fill="#f6f7f5" stroke="#dfe3de"/><text x="389" y="356" text-anchor="middle" fill="#3b443f">30</text>
    <rect x="406" y="342" width="34" height="20" fill="#f6f7f5" stroke="#dfe3de"/><text x="423" y="356" text-anchor="middle" fill="#3b443f">31</text>
  </g>

  <text x="32" y="382" font-size="11" fill="#8a938d">byte</text>
  <g font-size="10" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" fill="#8a938d">
    <text x="87" y="382" text-anchor="middle">0</text>
    <text x="121" y="382" text-anchor="middle">4</text>
    <text x="155" y="382" text-anchor="middle">8</text>
    <text x="189" y="382" text-anchor="middle">12</text>
    <text x="223" y="382" text-anchor="middle">16</text>
    <text x="389" y="382" text-anchor="middle">120</text>
    <text x="423" y="382" text-anchor="middle">124</text>
  </g>

  <g stroke="#0f7a4e" stroke-width="1" fill="none" opacity="0.5">
    <path d="M87,388 L87,406"/><path d="M121,388 L121,406"/><path d="M155,388 L155,406"/>
    <path d="M189,388 L189,406"/><path d="M223,388 L223,406"/>
    <path d="M389,388 L389,406"/><path d="M423,388 L423,406"/>
  </g>

  <text x="32" y="422" font-size="11" fill="#8a938d">bank</text>
  <g font-size="10" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace">
    <rect x="70" y="406" width="34" height="22" fill="#e2efe8" stroke="#0f7a4e"/><text x="87" y="421" text-anchor="middle" fill="#0f7a4e">0</text>
    <rect x="104" y="406" width="34" height="22" fill="#e2efe8" stroke="#0f7a4e"/><text x="121" y="421" text-anchor="middle" fill="#0f7a4e">1</text>
    <rect x="138" y="406" width="34" height="22" fill="#e2efe8" stroke="#0f7a4e"/><text x="155" y="421" text-anchor="middle" fill="#0f7a4e">2</text>
    <rect x="172" y="406" width="34" height="22" fill="#e2efe8" stroke="#0f7a4e"/><text x="189" y="421" text-anchor="middle" fill="#0f7a4e">3</text>
    <rect x="206" y="406" width="34" height="22" fill="#e2efe8" stroke="#0f7a4e"/><text x="223" y="421" text-anchor="middle" fill="#0f7a4e">4</text>
    <rect x="240" y="406" width="132" height="22" fill="#e2efe8" stroke="#0f7a4e"/><text x="306" y="421" text-anchor="middle" fill="#0f7a4e">5 … 29</text>
    <rect x="372" y="406" width="34" height="22" fill="#e2efe8" stroke="#0f7a4e"/><text x="389" y="421" text-anchor="middle" fill="#0f7a4e">30</text>
    <rect x="406" y="406" width="34" height="22" fill="#e2efe8" stroke="#0f7a4e"/><text x="423" y="421" text-anchor="middle" fill="#0f7a4e">31</text>
  </g>

  <text x="460" y="415" font-size="12" fill="#0f7a4e" font-weight="600">32 lanes, 32 banks, 1 wavefront.</text>
  <text x="460" y="433" font-size="11" fill="#59635d">bank = (m₀ + 32m₁) mod 32 = m₀</text>
  <text x="460" y="449" font-size="11" fill="#59635d">the pass index drops out entirely</text>
</svg>
